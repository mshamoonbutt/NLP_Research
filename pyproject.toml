[project]
name = "csjail"
version = "0.2.0"
description = "CS-Jail-UR: code-switched Urdu-English safety benchmark and preference-alignment study for small language models"
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "CS-Jail-UR Team" }]

# Base = CPU-only QA/analysis stack (Exp 0, statistics, aggregation, tests).
# GPU and API dependencies are opt-in extras so a CPU box never pulls CUDA wheels.
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "pandas>=2.2,<3",            # 3.x untested (copy-on-write, string dtype defaults)
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Judge + chosen-generator API clients (cross-platform). The chosen generator
# must be a different provider/model from the judge (csjail/chosen_gen.py).
judge = [
  "openai>=1.55,<2.0",
  "anthropic>=0.34",
  "httpx>=0.27",
]
# GPU inference (Linux + CUDA). Pinned together; vllm 0.6.3.post1 requires torch 2.4.0.
gpu = [
  "vllm==0.6.3.post1",
  "torch==2.4.0",
  "transformers==4.46.3",
  "accelerate==1.1.1",
]
# Phase-2 QLoRA-DPO stack. CANDIDATE pins chosen for mutual compatibility with
# the gpu extra; NOT yet verified on the GPU host -- run the tiny GPU smoke in
# docs/PROTOCOL.md §9 before trusting them. train_dpo.py records actual versions.
train = [
  "csjail[gpu]",
  "trl==0.12.2",
  "peft==0.13.2",
  "bitsandbytes==0.44.1",
  "datasets==3.1.0",
  # the version the passing GPU smoke used; 26.0.0 (2026-10-09) needs NumPy 2 at import but does not
  # declare it, and vllm 0.6.3 pins NumPy 1.26 -> `import datasets` fails
  "pyarrow==25.0.1",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "openpyxl>=3.1",   # review/rater workbooks (exp1_gold_audit, exp1_import_rater_xlsx, exp6_review, prepare_benign_probe)
]
# Backwards-compatible alias for the old CPU-only extra.
local = ["csjail[judge,dev]"]

[project.scripts]
csjail-eval = "csjail.run_eval:main"
csjail-aggregate = "csjail.aggregate:main"
csjail-convert = "csjail.convert_final:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csjail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
