[project]
name = "csjail"
version = "0.1.0"
description = "CS-Jail-UR: Code-switched Urdu-English jailbreak evaluation for Small Language Models"
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "CS-Jail-UR Team" }]

dependencies = [
  # Inference (Linux/A100 only — see scripts/setup_a100.sh)
  "vllm==0.6.3.post1",
  "transformers>=4.45,<4.50",
  "accelerate>=0.34",
  "torch>=2.4,<2.6",

  # Judge (cross-platform)
  "openai>=1.55,<2.0",
  "httpx>=0.27",
  "tenacity>=9.0",

  # Stats
  "numpy>=1.26,<3.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "pandas>=2.2",

  # IO / config
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
# Phase-2 training stack (GPU host only — QLoRA-DPO). Pulls heavy CUDA wheels.
train = [
  "trl>=0.11,<0.20",
  "peft>=0.13",
  "bitsandbytes>=0.44",
  "datasets>=3.0",
  "accelerate>=0.34",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
]
# vllm pulls heavy CUDA wheels; keep it out of the local Windows venv
local = [
  "openai>=1.55,<2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pytest>=8.3",
]

[project.scripts]
csjail-eval = "csjail.run_eval:main"
csjail-aggregate = "csjail.aggregate:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csjail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
