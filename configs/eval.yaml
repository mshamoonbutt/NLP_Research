# Evaluation defaults. CLI flags override.

sampling:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  seed: 0

inference:
  batch_size: 64           # vLLM handles internal batching; this is the chunk we feed it
  show_progress: true

stats:
  bootstrap_n: 10000
  bootstrap_seed: 0
  ci_alpha: 0.05           # 95% CI
  mcnemar_exact_threshold: 25   # discordant pairs <= 25 -> exact, else chi2

# Pairwise McNemar comparisons (Exp 3 isolation contrasts + headline).
#   CS vs RU  -> code-switching effect (same language, differs in mixing)
#   RU vs UR  -> script effect        (same language, differs in alphabet)
#   RU vs EN  -> language effect       (same script, differs in language)
#   CS vs EN  -> headline CS-gap
pairwise_comparisons:
  - [CS, RU]
  - [RU, UR]
  - [RU, EN]
  - [CS, EN]

# Harm categories are read DYNAMICALLY from the dataset (extended design has 10,
# e.g. C01..C10). Do not hardcode; this key is advisory only.
harm_categories: auto
conditions: [CS, EN, RU, UR]
