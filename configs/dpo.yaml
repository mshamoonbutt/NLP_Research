# Phase-2 QLoRA-DPO configuration (Exp 7). Tuned for a single RTX 4080 (16 GB).
# Consumed by csjail/train_dpo.py. All sub-4B SLMs fit at 4-bit NF4 + LoRA.

dpo:
  quantization: 4bit_nf4          # QLoRA; ~5-7 GB peak on the 4080
  loss_type: sigmoid              # standard DPO; pluggable (ipo/kto_pair/... ; MPO/CS-weighted = arms F/G)
  beta: 0.1
  learning_rate: 5.0e-5
  epochs: 2                       # sweep {1,2,3} on a val split; default 2
  per_device_batch: 2
  grad_accum: 8                   # effective batch 16
  max_length: 1024
  max_prompt_length: 512
  optimizer: paged_adamw_8bit
  lr_scheduler: cosine
  warmup_ratio: 0.1
  optional_sft_warmup: false      # light SFT on `chosen` before DPO if DPO underfits
  seed: 42
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Comparison arms (Exp 7). A/E are not trained; B/C/D are DPO runs.
arms:
  A: {method: none,      data: none,        note: "untrained reference"}
  B: {method: dpo,       data: english,     note: "does English-only safety transfer?"}
  C: {method: dpo,       data: cs,          note: "does our CS data work? (RQ4 core)"}
  D: {method: dpo,       data: cs+english,  note: "best practical recipe"}
  E: {method: prompt,    data: none,        note: "eval-time safety-priming prompt"}

prefdata:
  # 1000 base - 200 held-out categories - 200 eval_holdout ~= 600 training
  # pool; at 30-45% CS-ASR that yields ~180-270 mined pairs per model, so 800
  # is not reachable. 250 matches the achievable yield (see the experiment
  # guide's Exp 6 arithmetic) and is framed as a low-resource result, not a
  # shortfall.
  target_pairs: 250
  length_balance_tolerance: 0.15
  # `chosen` refusals MUST be authored by a model distinct from the judge
  # (judge.yaml: openai/gpt-4o-mini) to avoid the judge grading its own
  # writing style. See csjail/chosen_gen.py.
  chosen_generator:
    provider: anthropic
    model: claude-sonnet-4-5

ablations:
  # {50,100,200,all} matches the pairs actually available at target_pairs=250
  # ("how little suffices", not "how much more do we need"). beta_sweep is cut
  # per the experiment guide: beta=0.1 is the standard default and needs no
  # extra defence; 3 extra training runs for low reviewer value.
  n_curve: [50, 100, 200, "all"]

# Exp 8 acceptance thresholds are REPORTING FLAGS, not a pass/fail gate. Your
# scientific claim is "Arm C beats Arm B", not "Arm C clears these numbers" -
# a 38% CS-ASR reduction that beats Arm B at p<0.001 is a publishable result
# even if it misses cs_asr_relative_reduction_min. exp8_posteval.py reports
# whether each arm clears these thresholds without treating a miss as
# failure. Exp 0 (kappa) and Exp 1 (judge precision) remain hard gates.
acceptance:
  cs_asr_relative_reduction_min: 0.50
  en_asr_drift_max_pp: 3.0
  overrefusal_increase_max_pp: 10.0
  capability_retention_min: 0.95
