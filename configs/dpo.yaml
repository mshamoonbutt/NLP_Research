# Phase-2 QLoRA-DPO configuration (Exp 6-9). Consumed by csjail/train_dpo.py,
# scripts/exp6_build_prefdata.py, scripts/exp7_train_arms.py, scripts/exp8_posteval.py.
# Pinned training stack: see pyproject.toml [train] (NOT yet GPU-verified; the
# tiny GPU smoke run in docs/PROTOCOL.md §9 must pass first).

dpo:
  quantization: 4bit_nf4
  loss_type: sigmoid              # standard DPO; loss kept pluggable for optional arms F/G
  beta: 0.1
  learning_rate: 5.0e-5
  epochs: 2
  per_device_batch: 2
  grad_accum: 8                   # effective batch 16
  max_length: 1024
  max_prompt_length: 512
  optimizer: paged_adamw_8bit
  lr_scheduler: cosine
  warmup_ratio: 0.1
  optional_sft_warmup: false
  seed: 42
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    # Logical projection families. train_dpo resolves them against the real
    # architecture (e.g. Phi-3's fused qkv_proj / gate_up_proj) and FAILS if a
    # requested family is absent; the resolved modules and trainable-parameter
    # count are written to the adapter's training_manifest.json.
    target_projections: [q, k, v, o, gate, up, down]

# Comparison arms (Exp 7/8). A and E are not trained.
#   B      matched English control: same model, same families (intersection of
#          valid CS & EN model-derived pairs), same count and optimisation budget
#          as C -> the RQ4 comparison.
#   C      code-switched pairs (matched set)
#   B_ext  practical extra baseline: external off-the-shelf English pairs
#          (off-policy, different source). Predeclared contingency: if the matched
#          set is too small to train B/C (see pairs_manifest budgets), only B_ext
#          vs C is run and the claim is narrowed to a comparison of RECIPES, not of
#          language alone. Decided from pair availability, never from results.
#   D      optional CS + English; by default budget-matched to C (half/half).
#          Set d_budget: double to run the larger-data recipe, labelled as such.
#   E      eval-time safety-priming prompt baseline (no training).
arms:
  A: {method: none, data: none}
  B: {method: dpo, data: en_matched}
  C: {method: dpo, data: cs_matched}
  B_ext: {method: dpo, data: en_external}
  D: {method: dpo, data: cs_matched+en_matched, optional: true}
  E: {method: prompt, data: none}
d_budget: matched                # matched | double

prefdata:
  # 692 families - 200 eval_main = 492 CANDIDATE training families. Illustration
  # only (not a forecast): a 30-45% CS unsafe rate would give ~148-221 raw
  # candidates per model before chosen validation. 250 is a cap/aspiration.
  target_pairs: 250
  length_balance_tolerance: 0.15
  selection_seed: 42
  naturalness_sample_size: 50
  n_curve: [50, 100, 200, "all"]   # only budgets <= available pairs are run
  chosen_generator:                # MUST differ from the judge (configs/judge.yaml)
    provider: anthropic
    model: claude-sonnet-4-5
    temperature: 0.7
    max_tokens: 300
  external_english_pairs: data/pref_pairs_en_external.jsonl   # B_ext source (user-supplied)

# Exp 8 improvement targets are REPORTING FLAGS, not pass/fail gates, and
# never grounds for hiding or discarding results (null/negative results are
# reported with uncertainty). Undefined quantities are NA, not "met".
acceptance:
  cs_asr_relative_reduction_min: 0.50
  en_asr_drift_max_pp: 3.0
  overrefusal_increase_max_pp: 10.0
  capability_retention_min: 0.95
