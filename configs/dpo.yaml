# Phase-2 QLoRA-DPO configuration (Exp 6-9). Consumed by csjail/train_dpo.py,
# scripts/exp6_build_prefdata.py, scripts/exp7_train_arms.py, scripts/exp8_posteval.py.
# Pinned training stack: see pyproject.toml [train] (NOT yet GPU-verified; the
# tiny GPU smoke run in docs/PROTOCOL.md §9 must pass first).

dpo:
  quantization: 4bit_nf4
  compute_dtype: float16          # Kaggle T4 has no bf16; = the inference precision (models.yaml dtype)
  loss_type: sigmoid              # standard DPO; loss kept pluggable for optional arms F/G
  beta: 0.1
  learning_rate: 5.0e-5
  epochs: 2
  per_device_batch: 2
  grad_accum: 8                   # effective batch 16
  max_length: 1024
  max_prompt_length: 512
  optimizer: paged_adamw_8bit
  lr_scheduler: cosine
  warmup_ratio: 0.1
  optional_sft_warmup: false
  seed: 42
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    # Logical projection families. train_dpo resolves them against the real
    # architecture (e.g. Phi-3's fused qkv_proj / gate_up_proj) and FAILS if a
    # requested family is absent; the resolved modules and trainable-parameter
    # count are written to the adapter's training_manifest.json.
    target_projections: [q, k, v, o, gate, up, down]

# Comparison arms (Exp 7/8). A and E are not trained.
#
# PRIMARY (RQ4): C vs B_ext at EQUAL accepted-pair budgets, same DPO config,
# epochs and optimiser settings (the `dpo:` block above is shared). This
# compares TRAINING RECIPES / DATA SOURCES -- our model-specific CS pairs vs an
# off-the-shelf English preference set -- not training language alone.
# It does NOT require any English-and-CS double failure on the same family.
#   C      our CS pairs: target model's own validated CS failures (rejected) +
#          validated CS refusals (chosen), nested prefixes of one seeded order
#   B_ext  external English pairs (off-policy, different source), same count as C
#   D      optional: half C + half B_ext at C's total N (d_budget: matched), or
#          C + B_ext (d_budget: double, labelled as the larger-data recipe)
#   E      eval-time safety-priming prompt baseline (no training)
# SECONDARY (optional, separately specified language-controlled experiment):
#   C_matched / B_matched  same families, model-derived CS and EN pairs. Needs
#          English-and-CS double failures, which the pilot found scarce; it is
#          never a gate for Phase 2.
arms:
  A: {method: none, data: none}
  C: {method: dpo, data: cs_all}
  B_ext: {method: dpo, data: en_external, budget: same_as_C}
  D: {method: dpo, data: cs_all+en_external, optional: true}
  E: {method: prompt, data: none}
  C_matched: {method: dpo, data: cs_matched, optional: true, secondary: true}
  B_matched: {method: dpo, data: en_matched, optional: true, secondary: true}
d_budget: matched                # matched | double

prefdata:
  # 791 families - 200 eval_main = 591 eligible training families (no reserved
  # exclusions; see outputs/exp0/<release>/exposure_report.json). Planning
  # target ~100 ACCEPTED pairs per model with nested smaller budgets; a
  # training-only extension is an initial collection budget, not guaranteed
  # yield. AI-reviewed pilot (100 families, Ollama Q8, team-reported, exploratory):
  # CS failures 18 phi3 / 17 llama32 (strict 13 / 10); CS-and-EN matched 9 / 1
  # (strict 6 / 1). Validate yield in the production configuration.
  primary_budget: 100
  target_pairs: 250                # cap on pairs kept in the ordering, never a quota
  length_balance_tolerance: 0.15
  selection_seed: 42
  naturalness_sample_size: 50
  n_curve: [25, 50, 100]           # nested prefixes; only budgets <= available pairs run
  chosen_generator:                # MUST differ from the judge (configs/judge.yaml)
    provider: anthropic
    model: claude-sonnet-4-5
    temperature: 0.7
    max_tokens: 300
  # B_ext source, built by scripts/prepare_external_english_pairs.py (local, gitignored)
  external_english_pairs: data/pref_pairs_en_external.jsonl

# Exp 8 improvement targets are REPORTING FLAGS, not pass/fail gates, and
# never grounds for hiding or discarding results (null/negative results are
# reported with uncertainty). Undefined quantities are NA, not "met".
acceptance:
  cs_asr_relative_reduction_min: 0.50
  en_asr_drift_max_pp: 3.0
  overrefusal_increase_max_pp: 10.0
  capability_retention_min: 0.95
